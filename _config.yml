# BMFORGE_COMPONENT: bmforge.github-pages; spec_version: 0.1.0
# Shared presentation, including Mermaid rendering, lives in the theme.
remote_theme: "NadimGhaznavi/minimal-mistakes"
minimal_mistakes_skin: "dark"

title: "Nd3G"
title_separator: "-"
name: "Nd3G"
description: "LLM configured Snake Game AI."
locale: "en-US"
url: "https://nd3g.osoyalce.com"
baseurl: ""
repository: "NadimGhaznavi/nd3g"
# The masthead and homepage share the same project logo.
logo: "/pages/images/nd3g.png"

mycount:
  endpoint: "https://count.osoyalce.com/count"
  site: "nd3g"
multilingual:
  enabled: true
  default_lang: en

author:
  name: "Nadim Ghaznavi"
  bio: "Creator"
  location: ""
  email: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NadimGhaznavi"
footer:
  since: "2026"

include:
  - pages
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - scripts
  - tests
  - templates
  - components
  - skills
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - pyproject.toml
  - package.json
  - package-lock.json
  - nd3g
  - notes
  - .agents
  - .aws
  - .codex
  - .github
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: true
      read_time: false
      share: true
      related: true
